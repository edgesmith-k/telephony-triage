# site-defaults.example.yaml — 모의(사외 초안) 기본값
#
# 이 파일은 코드가 절대 읽지 않는다 (15-local-draft.md §15.1).
# 테스트 헬퍼 tests/helpers/make_plugin_root.py가 임시 플러그인 루트로 복사하면서
# 이름을 site-defaults.yaml로 바꿔 넣고, 그 루트를 ${CLAUDE_PLUGIN_ROOT}로 준다.
#
# 사내에서는 S-3에서 plugin/site-defaults.yaml을 직접 만든다 (SITE_PATHS).
# 개발 레포의 plugin/ 안에는 site-defaults.yaml을 만들지 않는다 (반입 체크리스트 §15.4).
#
# 설정 우선순위: 사용자 config > plugin/site-defaults.yaml > 코드 내장 기본값.

schema: 1

# 합성 fixture(origin: synthetic) 허용 여부.
# 사내 기본값은 false이고, 이 example(테스트 헬퍼 복사본)만 true다 (15-local-draft.md §15.2).
synthetic_allowed: true

jira:
  # 모의 MCP 서버 이름. 사내 setup은 exclude_servers로 mock-* 를 후보에서 뺀다.
  mcp_server: mock-jira

  # 사내 setup이 mock-* 을 후보에서 빼는 규칙. 테스트 헬퍼 복사본은 비워 둔다.
  exclude_servers: []

  # 논리 동작 → 실제 도구 전체 이름 (16-existing-assets.md §16.1)
  # 모의 서버는 일부러 비표준 이름을 쓴다. 매핑 경로를 반드시 거치게 하기 위해서다.
  tools:
    get_issue: mcp__mock-jira__jira_fetch_ticket        # 필수
    search_issues: mcp__mock-jira__jira_query_tickets   # 선택
    get_comments: mcp__mock-jira__jira_ticket_comments  # 선택

  # guard 허용 목록 = tools 값 + 사용자가 추가 확인한 읽기 도구 (08-safety.md §9)
  read_tools:
    - mcp__mock-jira__jira_fetch_ticket
    - mcp__mock-jira__jira_query_tickets
    - mcp__mock-jira__jira_ticket_comments

  timezone: Asia/Seoul        # TODO(SITE:S4) 사내 Jira 시각 타임존

  # Jira 응답 필드 → 분석 항목. 모의 서버는 일부러 사내와 다를 법한 커스텀 필드 이름을 쓴다.
  field_map:
    occurred_at: fields.customfield_10001
    model: fields.customfield_10002
    sw: fields.customfield_10003
    android_version: fields.customfield_10004
    carrier: fields.customfield_10005
    sim_slot: fields.customfield_10006      # TODO(SITE:S20) 사내 Jira에 슬롯 필드가 있는지
    test_steps: fields.customfield_10007    # TODO(SITE:S22) 시험 절차 필드가 있는지 (선택)
    failed_step: fields.customfield_10008   # TODO(SITE:S22) 실패 스텝 필드가 있는지 (선택)

  # 설명·시험 절차 텍스트에서 실패 스텝 한 줄을 찾는 줄 단위 정규식 (선택, 02-config.md). 기본값은 [].
  # (?P<step>…) 그룹이 있으면 그 값, 없으면 줄 전체. 정규식 오류는 경고만 낸다.
  failed_step_patterns:        # TODO(SITE:S22) 사내 시험 절차·실패 표기에 맞춘다
    - '(?i)^\s*(?:step|스텝|단계)\s*\d+\s*[.):-]?\s*(?P<step>.+?)\s*[-:|]?\s*(?:fail(?:ed)?|ng|실패)\s*$'
    - '(?i)^\s*(?:failed step|실패\s*(?:스텝|단계))\s*[:：]\s*(?P<step>.+)$'
    - '(?i)^(?P<step>.+?)\s*\|\s*(?:fail(?:ed)?|ng|실패)\s*(?:\|.*)?$'

ghe:
  host: ghe.mock.invalid      # TODO(SITE:S5) 사내 GHE 호스트
  org: mock-org               # TODO(SITE:S5) 사내 org

logcat:
  timezone: Asia/Seoul        # TODO(SITE:S7) logcat 시각 타임존
  year_source: jira           # jira | file-mtime | ask

parser:
  # site | reference. 사외 초안은 reference, 사내는 포팅 후 site (16-existing-assets.md §16.3)
  backend: reference

# 어댑터(외부 파서). 사외 초안은 비워 둔다.
# 형식은 plugin/scripts/adapters/base.py, 예시는 tests/mocks/adapters/site_data_existing.py.
external_parsers: {}

# 카테고리별 심층 분석 스킬 (16-existing-assets.md §16.5)
analyzers:
  data:
    skill: mock-data-analyzer          # tests/mocks/skills/data-analyzer/
    when: ask                          # ask | after_match | always_for_category
    inputs: [events_json, log_paths, top_candidates, jira_summary]
    max_tokens_hint: medium

# 탐색 분석: 후보 없음·원인 미확인일 때 Claude가 타임라인으로 가설을 세운다 (07-workflow.md §Step 5-2)
# 결과는 리포트 보조 절에만 쓰고 점수·분류·검증에는 쓰지 않는다.
explore:
  when: ask                            # ask | always | never (analyze --explore / --no-explore가 우선)
  timeline_max_lines: 200              # JOB/timeline.md 줄 수 상한 (20~1000)
