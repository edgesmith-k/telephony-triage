  #   boundary_regex: '^------ .* ------\s*$'

# 어댑터(외부 파서). 사외 초안은 비워 둔다.
# 형식은 plugin/scripts/adapters/base.py, 예시는 tests/mocks/adapters/site_data_existing.py.
external_parsers: {}

# 카테고리별 심층 분석 스킬 (16-existing-assets.md §16.5)
analyzers:
  data:
    skill: mock-data-analyzer          # tests/mocks/skills/data-analyzer/
    when: ask                          # ask | always | never
    inputs: [events_json, log_paths, top_candidates, issue_summary]
    max_tokens_hint: medium            # TODO(SITE:S10) 플러그인은 이 키를 읽지 않는다(S-4a에서 쓸지 지울지 결정)
    # source: /abs/path/to/analyzer-skill   # 선택: 분석 스킬 소스 checkout(SKILL.md가 있는 폴더, git 저장소 안). 있으면 [스킬] 제안
    #                                       # patch를 사용자가 승인한 뒤 그 워킹 트리에 git apply한다(커밋·push 안 함, 16 §16.5.1)

# 탐색 분석: 후보 없음·원인 미확인일 때 Claude가 타임라인으로 가설을 세운다 (07-workflow.md §Step 5-2)
# 결과는 리포트 보조 절에만 쓰고 점수·분류·검증에는 쓰지 않는다.
explore:
  when: ask                            # ask | always | never (analyze --explore / --no-explore가 우선)
  timeline_max_lines: 200              # JOB/timeline.md 줄 수 상한 (20~1000)

# 실패 스텝 기준 분석 구간 (07-workflow.md §Step 3, 02-config.md). TODO(SITE:S22)
# 시험 자동화가 logcat에 남기는 스텝 마커로 실패 스텝의 시간 구간을 정한다(어디를 볼지만 정하고 S/C는 로그가 정한다).
# 마커 패턴은 이 파일에서만 읽는다(사용자 config로 덮어쓸 수 없다). 비우면([]) 마커 스캔을 하지 않는다.
failed_step:
  # 로그 스텝 마커 패턴. 기본은 꺼짐([]): 실제 logcat에는 시험 스텝의 START/FAIL 마커가 없다.
  # 마스킹 전 `TAG: msg` 줄에 맞춘다. 이름 그룹 step, status 필수. 마커를 남기는 시험 자동화가 있을 때만 켠다.
  marker_patterns: []             # TODO(SITE:S22)
  # marker_patterns:
  #   - '^(?:TestRunner|Automation)\s*:\s*\[?(?i:step)\s*(?P<step>\d+)\]?\s*(?:[:-]\s*.*?\s)?(?P<status>START|PASS|FAIL)\b'
  marker_status: {start: [start, begin, 시작], pass: [pass, ok, 성공], fail: [fail, ng, error, 실패]}   # casefold 비교
  anchor_without_step: true       # 실패 스텝을 모를 때 FAIL 마커 자체를 앵커로 쓴다(스텝 이름은 DB에 쓰지 않는다)
  window: {pre_sec: 60, post_sec: 30, fail_only_pre_sec: 120, max_span_sec: 900}
  disagree_minutes: 10            # Jira 발생 시각과 스텝 실패 시각이 이만큼(분) 넘게 다르면 경고
  steps_file_tz: null             # steps-file 시각의 타임존. null이면 logcat 타임존
  # 시험 장비 시각 → 단말 logcat 시각 시계 차(단말 = 장비 + 값, 예: '+3m', '-00:00:45', 180). null이면 steps-file의
  # 장비 시각은 분석 구간에 쓰지 않는다(--clock-offset이 우선). TODO(SITE:S22) 장비·단말 시계가 같은지 확인한다
  clock_offset: null

  # 시험 절차(report.html·zip·붙여넣기) 읽기와 스텝 순서 정렬. TODO(SITE:S22) 사내 리포트의 열 이름·상태 낱말에 맞춘다
  steps_status: {pass: [pass, passed, ok, 성공, 통과], fail: [fail, failed, ng, 실패]}   # casefold 비교
  steps_columns:                  # 표 머리 열 이름(casefold 비교). 상태 열과 다른 열 하나 이상이 맞는 첫 줄이 머리
    number: ['no', '#', step no, 번호]      # YAML에서 no·yes·on·off는 따옴표로 감싼다(안 그러면 불리언이 된다)
    name: [step, action, name, description, 절차, 내용, 항목]
    status: [result, status, verdict, 결과, 판정]
    start: [start, start time, 시작]
    end: [end, end time, 종료, time, 시각]
  # 스텝 순서 정렬(이슈 DB `step_events` 규칙으로 로그에서 PASS 스텝의 흔적을 찾아 마지막 일치 뒤를 실패 구간으로 본다)
  order: {min_matched: 1, max_missing: 1, pre_sec: 10, fail_post_sec: 120}
