platform:
  name: android                      # 팀 기본 플랫폼. 아래 상수 키는 이 플랫폼 것
# (17-platforms) platform.enabled: 이 설치에서 쓸 플랫폼 목록(기본 플랫폼 포함). 없으면 [name]. 예:
#   enabled: [android, ofono]
# platform.others.<이름>: 기본 아닌 플랫폼의 상수(그 플랫폼이 받는 키만, ofono: source_tree·log·protocols). 예:
