  # log:
  #   phone_id:                      # TODO(SITE:S20) 슬롯 표기. 그룹 1 = 슬롯 번호. 위치마다 순서대로 첫 일치
  #     tag: ['^[A-Za-z]+(?:-[CI])?-(\d+)$']                   # 태그에 match
