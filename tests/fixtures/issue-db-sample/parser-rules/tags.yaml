# 수집할 logcat 태그 (04-parser-matching.md §5.8 (2))
#
# 데이터 스택 태그는 Android 13+ 형식으로 **확정**이다: DNC-<n>, DN-<id>-<C|I>,
# DPM-<n>, DRM-<n>, DSMGR-<n>(DataSettingsManager), DSM-<C|I>-<n>(DataServiceManager),
# DCM-<n>, DSRM-<n>. 레거시 데이터 스택(DcTracker/DCT)은 고려하지 않는다
# (플러그인 레포 `docs/design/14-site.md §14.1`).
#
# 그 밖의 태그는 **placeholder**다 — TODO(SITE:S9). 사내 실제 logcat으로
# 확인하고 바꾼다 (14-site.md §14.2).

tags:
  # --- data (확정 형식) ---
  - {tag_regex: '^DNC-\d+$',   category: data, added_for: DATA-001, added_on: 2026-09-28, reason: 초기 (DataNetworkController)}
  - {tag_regex: '^DN-.+$',     category: data, added_for: DATA-001, added_on: 2026-09-28, reason: 초기 (DataNetwork)}
  - {tag_regex: '^DPM-\d+$',   category: data, added_for: DATA-001, added_on: 2026-09-28, reason: 초기 (DataProfileManager)}
  - {tag_regex: '^DRM-\d+$',   category: data, added_for: DATA-001, added_on: 2026-09-28, reason: 초기 (DataRetryManager)}
  - {tag_regex: '^DSMGR-\d+$', category: data, added_for: DATA-001-01, added_on: 2026-09-28, reason: data enabled/disabled 판별 (DataSettingsManager)}
  - {tag_regex: '^DSM-[CI]-\d+$', category: data, added_for: '-', added_on: 2026-10-07, reason: 데이터 서비스 요청·응답 (DataServiceManager)}
  - {tag_regex: '^DCM-\d+$',   category: data, added_for: DATA-001, added_on: 2026-09-28, reason: 초기 (DataConfigManager)}
  - {tag_regex: '^DSRM-\d+$',  category: data, added_for: DATA-001, added_on: 2026-09-28, reason: 초기 (DataStallRecoveryManager)}

  # --- common ---
  - {tag: RILJ, category: common, added_for: '-', added_on: 2026-09-28, reason: 초기 (RIL 요청·응답·unsol)}

  # --- call / ims --- TODO(SITE:S9) TODO(SITE:S10)
  - {tag_regex: '^ImsPhone.*', category: call, added_for: CALL-001, added_on: 2026-09-28, reason: 초기 (ImsPhoneCallTracker 등)}
  - {tag_regex: '^Ims(Manager|Resolver|ServiceController|Registration).*', category: ims, added_for: IMS-001, added_on: 2026-09-28, reason: 초기 (IMS 등록 상태)}

  # --- network --- TODO(SITE:S9)
  - {tag_regex: '^(SST|ServiceStateTracker)(-\d+)?$', category: network, added_for: NETWORK-001, added_on: 2026-09-28, reason: 초기 (망 등록·서비스 상태)}

  # --- sim --- TODO(SITE:S9)
  - {tag: UiccController, category: sim, added_for: SIM-001, added_on: 2026-09-28, reason: 초기 (SIM 상태)}
  - {tag_regex: '^(SMSVC|SubscriptionManagerService)$', category: sim, added_for: SIM-001, added_on: 2026-09-28, reason: 초기 (가입자 정보)}

  # --- sms --- TODO(SITE:S9)
  - {tag: SmsDispatchersController, category: sms, added_for: SMS-001, added_on: 2026-09-28, reason: 초기 (SMS 전송)}
  - {tag: InboundSmsHandler, category: sms, added_for: SMS-001, added_on: 2026-09-28, reason: 초기 (SMS 수신)}
