# eval 81: 무선을 켠 뒤 망 등록이 거절된다(거절 사유 7, 이슈 DB의 NETWORK-001-01은 11/13/15만) → 증상 NETWORK-001, 원인 미확인.
# 성공 흐름 network/radio-on은 망 등록 단계에서 값이상(mDataRegState 미등록)으로 멈추고, 1위 증상 근거(거절 줄)가 그 인스턴스 안이다.
# 문구는 Android 17 캡처 형식(시드 흐름 fixture·NETWORK-001-01 시나리오와 같은 모양)이고 거절 사유 7은 합성이다.
