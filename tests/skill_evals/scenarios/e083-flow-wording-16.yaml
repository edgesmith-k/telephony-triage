# eval 83: 데이터 연결(DN-1-C)은 정상으로 끝까지 됐고, 1분 뒤 비행기 모드로 끊긴다 → DATA-002-01(1위, C=1).
# 이슈 버전 16, 시드 흐름 data/data-setup 기준 버전 17. **연결 단계 줄 `ConnectedState: Data network connected, transport=WWAN`은
# 지어낸 합성 문구다(실제 Android 16 문구가 아니다)** — 흐름 패턴 `ConnectedState: network connected\.`에 안 맞아 연결 단계가
# `없음`(연결 해제로 끝남)이 되고, 같은 로그에 그 단계를 정상으로 지난 인스턴스가 없어 리포트가 put-flow 제안 줄을 낸다.
# 나머지 줄은 Android 17 캡처 형식(시드 흐름 fixture·DATA-002-01 시나리오와 같은 모양), 주소는 문서용 TEST-NET.
