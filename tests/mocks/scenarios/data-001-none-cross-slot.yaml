# 교차 슬롯 음성 fixture (11-phases.md Phase 1: DATA-001.none.2.log).
#
# 슬롯 1에는 원인 로그(데이터 설정 꺼짐)만, 슬롯 0에는 거부 로그(증상 쪽)만 있다.
# 순서: 슬롯 1의 설정 OFF → 슬롯 0의 거부 → 슬롯 0 곧 정상 연결.
#  - 원인 DATA-001-01은 `same_phone: true`라서 슬롯 1의 설정 OFF + 슬롯 0의 거부로
#    충족되면 안 된다 (04-parser-matching.md §5.8 (2) 슬롯). `same_phone: false`로 바꾼
#    사본에서는 순서(`sequence: [setting-off, rejected]`)까지 맞아 충족된다
#    (11-phases.md Phase 3 완료 기준).
#  - 슬롯 0은 곧 데이터가 붙어서(SETUP_DATA_CALL) 증상 시그니처의
#    `must_not_match`에 걸린다. 그래서 어느 유형도 S=1이 아니다.
name: DATA-001.none.2
start: "2026-09-23T11:00:00+09:00"
default_phone: 0
pid: 1234
tid: 1244
expect:
  expect_top: none
entries:
  # 슬롯 1: 원인 로그(설정 OFF)가 다른 슬롯에 먼저 있다.
  - {at: 0, tag: "DSM-{phone}", msg: "onDataEnabledChanged: enabled=false reason=USER", phone: 1}
  # 슬롯 0: 평가가 거부된다. 이 슬롯에는 설정 변경 로그가 없다.
  - {after: 1, tag: "DNC-{phone}", level: I, msg: "onEvaluateNetworkRequests: reason=NETWORK_REQUEST_ADDED", phone: 0}
  - {after: 0.5, tag: "DNC-{phone}", level: W, msg: "evaluation result: NOT_ALLOWED reasons=[DATA_DISABLED]", phone: 0}
  # 슬롯 0: 사용자가 데이터를 켜서 곧 연결된다 (같은 윈도우 안이라 증상이 깨진다).
  - {after: 2, tag: "DSM-{phone}", msg: "isDataEnabled=true", phone: 0}
  - {after: 0.5, tag: "DNC-{phone}", level: I, msg: "evaluation result: ALLOWED reasons=[]", phone: 0}
  - {after: 0.3, ril_request: SETUP_DATA_CALL, serial: 41, args: "apn=default", phone: 0}
  - {after: 0.9, ril_response: SETUP_DATA_CALL, serial: 41, result: "error=NONE cid=1", phone: 0}
