schema_version: 2
platforms:
  ofono:
    common: {daemons: [ofonod, mgmtd, vrild]}
    modules:
      data: {path: ofono/data, db_category: data, daemons: [datad, datad2], ofonod_files: [src/gprs.c, drivers/rilmodem/gprs-context.c, src/lte.c]}
      sim: {path: ofono/sim, db_category: sim, daemons: [simd], ofonod_files: [src/sim.c, drivers/rilmodem/sim.c]}
      modem: {path: ofono/modem, db_category: common, daemons: [], ofonod_files: [src/modem.c], ril: [RADIO_POWER]}
  android:
    common:
      tags: ['^RILJ$']
      filter:
        noise: ['^\[MsgRouterMgr\] msg\(']
        state: [['^RILJ$', 'RADIO_POWER']]
        level_unreliable: [VRIL-MODEM]
    modules:
      data: {path: android/data, db_category: data, dbus: [com.example.Data]}
      sim: {path: android/sim, db_category: sim, ipc: [VIPC_EXAMPLE_SIM]}
