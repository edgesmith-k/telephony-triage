# 합성 샘플 이슈 DB의 fixture 목록 (11-phases.md Phase 1)
#
# `tests/helpers/make_sample_fixtures.py`가 이 표대로 `tests/mocks/logcat_gen.py`를
# 돌려 `tests/fixtures/issue-db-sample/<type_dir>/fixtures/`에 넣는다.
# 생성기는 결정적이므로 같은 시나리오는 항상 같은 파일을 낸다
# (`--check`로 커밋된 fixture와 재생성 결과가 같은지 검사한다).
#
# 파일 이름 규칙은 `contracts.md §fixture`다. `name`이 곧 파일 이름이고,
# `<name>.log`와 (시나리오에 expect가 있으면) `<name>.expect.yaml`이 나온다.
# 모든 fixture는 합성이므로 `.expect.yaml`에 `origin: synthetic`이 붙는다.

