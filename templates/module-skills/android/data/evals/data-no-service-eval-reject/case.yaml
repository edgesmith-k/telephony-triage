# 합성 case (11/13 질문 13 — NOT_IN_SERVICE 평가 거부). 출처: Android 17 에뮬레이터 캡처 d32f-fail-reg-unregistered(데이터 등록을 미등록으로 둔 채 모바일 데이터를 켬)에서 고른 줄 — AOSP 층만, 벤더 줄 없음. 등록을 잃은 뒤(SST pollStateDone hasDeregistered = true, DNC onServiceStateChanged HOME->NOT_REG_OR_SEARCHING — 캡처의 RILJ DATA_REGISTRATION_STATE 응답은 NOT_REG_MT_NOT_SEARCHING_OP이지만 data 보기에 남지 않아 넣지 않았다) DNC가 NOT_IN_SERVICE로 평가를 거부해 SETUP_DATA_CALL이 나가지 않는다 — 프레임워크는 증상이다. 함정: 평가 거부(DNC)를 프레임워크 원인으로 답함, 데이터를 켠 줄(reason=USER)을 사용자 설정으로 읽음, 같은 시각 SET_USER_DATA_ENABLED error 6(미지원 요청)을 RILJ·벤더 RIL 원인으로 답함. files/의 source.log 말고는 make_module_eval_inputs.py --write가 만든다
