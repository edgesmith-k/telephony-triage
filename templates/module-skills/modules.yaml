# modules.yaml (스키마 2, B2 §4.5). 스크립트(common/modulefilter.py·skillcheck)만 읽고 모델은 읽지 않는다.
# 값은 placeholder(지어낸 일반 이름)와 공개 이름(AOSP·oFono upstream·RIL·3GPP)이다. 가지는 합성 로그가 쓰는 것만 둔다.
# 사내 고유 어휘는 사내 overlay(SITE_PATHS)에 둔다. 줄 끝 주석 D(레포 문서)·A(가정)를 적는다.
# 사내는 modules.yaml PR로 고친다(결정 기록 11/05 "사내랑 안 맞는 것은 사내에서").
# 키워드는 글자 그대로, `re:`로 시작하는 것만 정규식이다. 벤더 데몬·IPC·서비스·D-Bus 이름을 쓸 수 있다(결정 기록 11/05).
schema_version: 2
platforms:
  ofono:
    common:
      daemons: [ofonod, mgmtd, vrild]
      filter:
        noise_tags: [chatterd]
        noise:
          - 'VIPC_EXAMPLE_SIGNAL_IND'
          - '^(Device|IMSD) \d+: |<HEXDUMP'
          - '^ui tick$'
          - 'link tx|link rx'
        level_unreliable: [datad2, mgmtd]
        not_error:
          - '(RejectCause|reject cause|errorCode|IpcErrorCode|rejectCode)\s*[:=(]\s*0\b'
        background:
          - 'SIM_OPEN_CHANNEL|__ofono_error_not_found\(\).*m:ExampleOpenChannel|openChannel: Application not found|ExampleEuiccNoResponse|eUICC example timeout|GetEID FAILED|Failed to get EID'
        state:
          - ['.', 'RADIO_POWER|RADIO_STATE_CHANGED|RADIO_O(N|FF)\b']
          - ['.', 'IMS_REQUEST_EXAMPLE_APM']
        chain: 'VCHAN_\d+ REQUEST|\]\[(TX|RX)\] VIPC_|OnIpcComplete|RejectCause=[1-9]|sw1|Error\(VIPC_E_'
        request_on_line: '^\[\d+,\w+\][<>] ?(?:RIL_(?:REQUEST_)?)?([A-Z][A-Z0-9_]+)|VCHAN_\d+ (?:REQUEST|UNSOLICITED): (?:RIL_(?:REQUEST_)?)?(\w+)'
        source_file: '^((?:src|drivers|plugins)/[\w/-]+\.c):'
        client_tag: '^\[(\w+)\]'
        inherit_ms: 3
    modules:
      data:
        path: ofono/data
        db_category: data
        daemons: [datad, datad2]
        ofonod_files: [src/gprs.c, src/lte.c, drivers/rilmodem/gprs.c, drivers/rilmodem/gprs-context.c, drivers/rilmodem/lte.c]
        ril: [SETUP_DATA_CALL, DEACTIVATE_DATA_CALL, DATA_CALL_LIST, SET_DATA_PROFILE, SET_INITIAL_ATTACH_APN, UNSOL_DATA_CALL_LIST_CHANGED]
        ipc: [VIPC_EXAMPLE_PDN_UP, VIPC_EXAMPLE_PDN_DOWN, VIPC_EXAMPLE_PDN_LIST_IND, VIPC_EXAMPLE_PDN_LIST, VIPC_EXAMPLE_PROFILE, VIPC_EXAMPLE_ATTACH_PROFILE, VIPC_EXAMPLE_ATTACH_IND, VIPC_EXAMPLE_ADDR_IND, VIPC_EXAMPLE_CARRIER_IND]
        services: [ExamplePdnService]
        dbus: [org.ofono.ConnectionManager, org.ofono.ConnectionContext, org.ofono.LongTermEvolution, org.ofono.AllowedAccessPoints]
        client_tags: []   # TODO(SITE:S25) data 사내 구성요소(사내 스냅샷 SITE_RESTORE ⓪, 덮어쓰기 ③)
        keywords: ['re:\brmnet\d+', 'PdnCtx']
        neighbours: [network]
      sim:
        path: ofono/sim
        db_category: sim
        daemons: [simd]
        ofonod_files: [src/sim.c, src/simfs.c, drivers/rilmodem/sim.c]   # simfs.c: D (not in logs)
        ril: [SIM_IO, GET_SIM_STATUS, SIM_OPEN_CHANNEL, GET_SIM_PIN_PUK_RETRIES, SIM_AUTHENTICATION, UNSOL_RESPONSE_SIM_STATUS_CHANGED]
        ipc: [VIPC_EXAMPLE_CARD_IO, VIPC_EXAMPLE_CARD_STATE, VIPC_EXAMPLE_CARD_OPEN, VIPC_EXAMPLE_CARD_IND, VIPC_EXAMPLE_CARD_AUTH]
        services: [ExampleIccService, ExampleEfService, ExampleSatService]
        dbus: [org.ofono.SimManager, org.ofono.SimToolkit]
        client_tags: []   # TODO(SITE:S25) sim 사내 구성요소(사내 스냅샷 SITE_RESTORE ⓪, 덮어쓰기 ③)
        keywords: ['re:sw1 ?[:=]', 're:\beUICC\b', 'GetEID']
      network:
        path: ofono/network
        db_category: network
        daemons: [networkd]
        ofonod_files: [src/network.c, src/netmon.c, src/radio-settings.c, drivers/rilmodem/network-registration.c, drivers/rilmodem/netmon.c, drivers/rilmodem/radio-settings.c]
        ril: [VOICE_REGISTRATION_STATE, DATA_REGISTRATION_STATE, OPERATOR, SIGNAL_STRENGTH, GET_PREFERRED_NETWORK_TYPE, GET_ALLOWED_NETWORK_TYPES_BITMAP, SET_UNSOL_CELL_INFO_LIST_RATE, UNSOL_RESPONSE_VOICE_NETWORK_STATE_CHANGED, UNSOL_PHYSICAL_CHANNEL_CONFIG, UNSOL_RESTRICTED_STATE_CHANGED, UNSOL_CELL_INFO_LIST]
        ipc: [VIPC_EXAMPLE_OPER, VIPC_EXAMPLE_PS_REG, VIPC_EXAMPLE_CS_REG, VIPC_EXAMPLE_RAT_MODE, VIPC_EXAMPLE_RAT_MASK, VIPC_EXAMPLE_NET_IND, VIPC_EXAMPLE_NO_SERVICE_IND, VIPC_EXAMPLE_CARRIER_IND, VIPC_EXAMPLE_CELL_IND, VIPC_EXAMPLE_CELL_RATE]
        services: [ExampleRegService]
        dbus: [org.ofono.NetworkRegistration, org.ofono.RadioSettings, org.ofono.NetworkMonitor, org.ofono.NetworkOperator]
        client_tags: []   # TODO(SITE:S25) network 사내 구성요소(사내 스냅샷 SITE_RESTORE ⓪, 덮어쓰기 ③)
        keywords: ['RegState=']
      call:
        path: ofono/call
        db_category: call
        daemons: []   # TODO(SITE:S25) call 사내 구성요소(사내 스냅샷 SITE_RESTORE ⓪, 덮어쓰기 ③)
        ofonod_files: [src/voicecall.c, src/call-settings.c, src/call-forwarding.c, src/call-barring.c, drivers/rilmodem/voicecall.c]
        ril: [UNSOL_EMERGENCY_NUMBER_LIST, DIAL, HANGUP, GET_CURRENT_CALLS, LAST_CALL_FAIL_CAUSE, UNSOL_RESPONSE_CALL_STATE_CHANGED]   # A: 첫 값 외에는 가정
        ipc: [VIPC_EXAMPLE_ECC_IND]
        services: [ExampleCallService]
        dbus: [org.ofono.VoiceCallManager, org.ofono.CallSettings, org.ofono.CallForwarding, org.ofono.CallBarring, org.ofono.CallVolume, org.ofono.SupplementaryServices]
        client_tags: []   # TODO(SITE:S25) call 사내 구성요소(사내 스냅샷 SITE_RESTORE ⓪, 덮어쓰기 ③)
        also: {imsd: 'ImsCallManager|EPSFB|\bDial', ofonod: 'IMS_UNSOL_CAPABILITIES'}
        neighbours: [ims]
      sms:
        path: ofono/sms
        db_category: sms
        daemons: []   # TODO(SITE:S25) sms 사내 구성요소(사내 스냅샷 SITE_RESTORE ⓪, 덮어쓰기 ③)
        ofonod_files: [src/sms.c, src/cbs.c]
        ril: [SEND_SMS, SMS_ACKNOWLEDGE, UNSOL_RESPONSE_NEW_SMS]   # A: 합성 로그에 없음(가정)
        ipc: [VIPC_EXAMPLE_SMSC_QUERY]
        services: [ExampleSmsService]
        dbus: [org.ofono.MessageManager, org.ofono.CellBroadcast, org.ofono.PushNotification, org.ofono.SmartMessaging, org.ofono.MessageWaiting]
        client_tags: []   # TODO(SITE:S25) sms 사내 구성요소(사내 스냅샷 SITE_RESTORE ⓪, 덮어쓰기 ③)
        also: {imsd: 'SMS'}
        neighbours: [ims]
      ims:
        path: ofono/ims
        db_category: ims
        daemons: [imsd]
        ofonod_files: [src/ims.c]
        ril: [IMS_REQUEST_SET_PDN_INFO, IMS_REQUEST_EXAMPLE_OPER_INFO, IMS_REQUEST_EXAMPLE_APM, IMS_UNSOL_PDN_ACTIVATE, IMS_UNSOL_PDN_DEACTIVATE, IMS_UNSOL_OPERATOR_INFO_QUERY, IMS_UNSOL_EXAMPLE_REG_STATE, IMS_UNSOL_CAPABILITIES, IMS_UNSOL_REG_FAILED]
        ipc: [VIPC_EXAMPLE_IMS_*]
        services: [ImsService]
        dbus: [org.ofono.IpMultimediaSystem]
        keywords: ['re:OEM_(REQ|UNSOL)_IMS_']
        also: {ofonod: 'UNSOL_DATA_CALL_LIST_CHANGED'}
        neighbours: [data]
      modem:
        path: ofono/modem
        db_category: common
        daemons: []   # TODO(SITE:S25) modem 사내 구성요소(사내 스냅샷 SITE_RESTORE ⓪, 덮어쓰기 ③)
        ofonod_files: [src/modem.c, plugins/ril.c]
        ril: [RADIO_POWER, UNSOL_RESPONSE_RADIO_STATE_CHANGED]
        ipc: [VIPC_EXAMPLE_POWER, VIPC_EXAMPLE_POWER_IND, VIPC_EXAMPLE_NO_SERVICE_IND]   # OUT_OF_SERVICE: network와 겹침, 망 없음은 모뎀 상태로도 본다 (H C1)
        dbus: [org.ofono.Modem]
  android:
    common:
      tags: ['^RILJ$', '^RilRequest$', '^(RIL|VRIL|VRIL-SVC)$']
      filter:
        noise:
          - '<HEXDUMP \d+B>|^\[VrilRouter\] |^waitlist hit |^route rsp |^VrilApp::instance'
          - '^\[IpcCtx_\d\] (rx frame|Send|route req|OnRequest|OnIpcIndication)\b'
          - '^\[indFilter\] |^reply to client token'
          - 'satelliteConfigParser is not ready'
          - '^(Idle|Delivering|Waiting|Startup)State\.(enter|exit|processMessage): '   # A: GsmInboundSmsHandler 상태 기계 잡음(캡처)
        not_error:
          - '^waitlist miss '
        background: []
        state:
          - ['^VRIL-MODEM$', 'at-in: AT\+CFUN']
          - ['^VRIL-MODEM$', 'at-in: AT|at-out: ']
          - ['^VRIL$', 'RADIO_STATE_CHANGED|radio state changed']
          - ['^RILJ$', 'RADIO_POWER|UNSOL_RESPONSE_RADIO_STATE_CHANGED|Unable to complete']
          - ['^ImsPhone$', 'handleIms(Un)?[Rr]egistered']
          - ['^SST-\d+$', 'hasRegistered = true|hasDeregistered = true']
          - ['^DNC-\d+$', 'Internet data state changed']
          - ['^RIL$', 'vendor status|Error\(VIPC_E_|RIL_E_[A-Z_]+']
        chain: '\]\[(TX|RX)\] VIPC_|(un)?track seq|errorCode=|serial \d+|(request|response): serial'
        request_on_line: '^\[(?:\d+|UNSL)\][<>]\s*(?:iccIO: )?(?:RIL_)?([A-Z][A-Z0-9_]+)|VCHAN_\d+ (?:REQUEST|UNSOLICITED): (?:RIL_(?:REQUEST_)?)?(\w+)'
        inherit_ms: 0
    modules:
      data:
        path: android/data
        db_category: data
        tags: ['^DNC-\d+$', '^DN-\d+-[CI]$', '^DPM-\d+$', '^DRM-\d+$', '^DSMGR-\d+$', '^DSM-[CI]-\d+$', '^DCM-\d+$', '^DSRM-\d+$', '^ANM-\d+$', '^TNP$', '^TNA-\d+$', '^QOSCT-\d+$', '^DataServiceCallback$', '^ConnectivityService$', '^PhoneSwitcher$', '^ADSC$', '^VRIL-DATA$']
        ril: [SETUP_DATA_CALL, DEACTIVATE_DATA_CALL, SET_INITIAL_ATTACH_APN, SET_DATA_PROFILE, SET_USER_DATA_ENABLED, SET_USER_DATA_ROAMING_ENABLED, UNSOL_DATA_CALL_LIST_CHANGED, UNSOL_DATA_CALL_LIST_UPDATED, DATA_CALL_LIST]
        hal: [RadioDataProxy]
        services: [ExamplePdnService]
        ipc: [VIPC_EXAMPLE_PDN_UP, VIPC_EXAMPLE_PDN_DOWN, VIPC_EXAMPLE_PDN_LIST, VIPC_EXAMPLE_PROFILE, VIPC_EXAMPLE_ATTACH_PROFILE, VIPC_EXAMPLE_DATA_SWITCH, VIPC_EXAMPLE_PDN_LIST_IND, VIPC_EXAMPLE_ADDR_IND]
        keywords: ['re:data call list|PdnCtx']
        neighbours: [network]
      sim:
        path: android/sim
        db_category: sim
        tags: ['^UiccController$', '^UiccSlot( \[\d+\])?$', '^UiccCard$', '^UiccProfile( \[\d+\])?$', '^UiccCardApplication( \[\d+\])?$', '^SIMRecords$', '^IsimUiccRecords$', '^UsimFH$', '^SMSVC$', '^CAT$', '^MultiSimSettingController$', '^SecureElement-Terminal-SIM\d$']
        ril: [GET_SIM_STATUS, SIM_IO, SIM_OPEN_CHANNEL, SIM_CLOSE_CHANNEL, SIM_TRANSMIT_APDU_CHANNEL, STK_SEND_TERMINAL_RESPONSE, UNSOL_STK_SESSION_END, UNSOL_RESPONSE_SIM_STATUS_CHANGED]
        hal: [RadioSimProxy]
        services: [ExampleIccService, ExampleEfService, ExampleSatService]
        ipc: [VIPC_EXAMPLE_CARD_STATE, VIPC_EXAMPLE_CARD_IO, VIPC_EXAMPLE_CARD_OPEN*, VIPC_EXAMPLE_CARD_CLOSE, VIPC_EXAMPLE_CARD_APDU*, VIPC_EXAMPLE_TOOLKIT*]
        keywords: ['re:SIM_STATE_CHANGED (READY|LOADED|ABSENT|NOT_READY|LOCKED|CARD_IO_ERROR)']
      network:
        path: android/network
        db_category: network
        tags: ['^SST-\d+$', '^NRM-[CI]-\d+$', '^CellularNetworkService$', '^NetworkTypeController$', '^CSST$', '^LocaleTracker-\d+$', '^NitzStateMachineImpl$', '^DIC-\d+$', '^VRIL-NETWORK$']
        ril: [VOICE_REGISTRATION_STATE, DATA_REGISTRATION_STATE, OPERATOR, QUERY_NETWORK_SELECTION_MODE, GET_CELL_INFO_LIST, SET_ALLOWED_NETWORK_TYPES_BITMAP, IS_N1_MODE_ENABLED, SET_SIGNAL_STRENGTH_REPORTING_CRITERIA, SET_USAGE_SETTING, GET_USAGE_SETTING, SET_SATELLITE_PLMN, UNSOL_RESPONSE_NETWORK_STATE_CHANGED, UNSOL_PHYSICAL_CHANNEL_CONFIG, UNSOL_VOICE_RADIO_TECH_CHANGED]
        hal: [RadioNetworkProxy]
        services: [ExampleRegService]
        ipc: [VIPC_EXAMPLE_PS_REG, VIPC_EXAMPLE_CS_REG, VIPC_EXAMPLE_OPER, VIPC_EXAMPLE_NET_IND, VIPC_EXAMPLE_CARRIER_IND, VIPC_EXAMPLE_CELL_QUERY*, VIPC_EXAMPLE_RAT_MASK*]
        keywords: ['re:reg state request|net state indication']
      call:
        path: android/call
        db_category: call
        tags: ['^ImsPhoneCallTracker$', '^ImsPhoneMmiCode$', '^ImsUt$', '^Telecom$', '^CallManager$', '^CallNotifier$', '^CallWaitingCtrl$', '^MMIDialogActivity$', '^GsmCdmaCallTracker$']   # A: GsmCdmaCallTracker
        ril: [SET_CLIR, ENABLE_VONR, UNSOL_EMERGENCY_NUMBER_LIST, DIAL, HANGUP, GET_CURRENT_CALLS, LAST_CALL_FAIL_CAUSE, UNSOL_RESPONSE_CALL_STATE_CHANGED]   # A: DIAL..LAST_CALL_FAIL_CAUSE
        hal: [RadioVoiceProxy]
        services: [ExampleCallService, ExampleSsService]
        ipc: [VIPC_EXAMPLE_IMS_CF*, VIPC_EXAMPLE_VONR_SWITCH, VIPC_EXAMPLE_ECC_IND]
        keywords: ['re:\[ut\]', 'OEM_REQ_IMS_SET_CALL_FORWARD', 're:at-in: ATD']
        also: {'^ImsPhone$': 'dialInternal|MmiCode|onMMIDone|Call', '^GsmCdmaPhone$': 'useImsForCall=', '^VRIL-IMS$': '\[ut\]|OEM_REQ_IMS_SET_CALL_FORWARD|INVITE', '^Telephony$': '^(PstnIncomingCallNotifier: handleNew|onCreate(Incoming|Outgoing|Unknown)Conn|placeOutgoingConn|perform(Answer|Reject|Hold|Unhold)|Holding active|getFirstPhoneForEmergency|isEmergencyNumberTest|Exception occurred|CallStateException|onStateChanged, state:|MSG_PRECISE_CALL)|onDisconnect', '^Phone-\d+$': 'Event EVENT_CALL_RING|notifyNewRingingConnection'}   # INVITE: 사내 확인. A: Telephony·Phone-<n>는 통화 줄만(캡처, 통화 밖 0줄)
        neighbours: [ims]
      sms:
        path: android/sms
        db_category: sms
        tags: ['^(Gsm|Cdma)?SMSDispatcher$', '^ImsSmsDispatcher( \[\d+\])?$', '^CellBroadcastConfigTracker-\d+$', '^SmsDispatchersController$', '^(Gsm|Cdma)?InboundSmsHandler$', '^DomainSelectionConnection-(SMS|EmergencySMS)$']   # A: DomainSelectionConnection-*는 소스만(캡처 없음)
        ril: [GSM_SET_BROADCAST_CONFIG, GSM_BROADCAST_ACTIVATION, SEND_SMS, IMS_SEND_SMS, SMS_ACKNOWLEDGE, UNSOL_RESPONSE_NEW_SMS]   # A: SEND_SMS..
        hal: [RadioMessagingProxy]
        services: [ExampleSmsService]
        ipc: [VIPC_*SMS*]
        also: {'^VRIL-IMS$': '\[sms\]'}   # SMS over IMS 벤더 줄(`[sms]` 접두는 합성 모양, 사내에서 확인)
        neighbours: [ims]
      ims:
        path: android/ims
        db_category: ims
        tags: ['^ImsManager', '^ImsResolver$', '^ImsServiceController$', '^ImsProvisioning', '^ImsConfig$', '^ImsEnablementTracker$', '^ImsStateCallbackController$', '^ImsRegCallbackHelper$', '^ImsStats$', '^VRIL-IMS$']
        ril: [NOTIFY_IMS_DATA_NETWORK, UPDATE_IMS_REGISTRATION_INFO]   # A: UPDATE_IMS_REGISTRATION_INFO as a RILJ request
        services: [ImsService]
        ipc: [VIPC_EXAMPLE_IMS_*]
        keywords: ['registerImsRegistrationCallback', 'service IMS is not available', 'notifyImsDataNetwork not supported on service', 'ImsReasonInfo', 're:ims registration indication: (TRUE|FALSE)']   # 마지막: RIL [ImsService_<n>] 줄(태그는 common). A: notifyImsDataNetwork …는 소스만(캡처 없음)
        also: {'^ImsPhone$': 'handleIms(Un)?[Rr]egistered|ImsRegistration'}
        neighbours: [data]
      modem:
        path: android/modem
        db_category: common
        tags: ['^PhoneCfgMgr$', '^RadioConfig$', '^RadioConfigResponseAidl$', '^VRIL-MODEM$']
        ril: [GET_RADIO_CAPABILITY, SET_PREFERRED_DATA_MODEM, ENABLE_MODEM, BASEBAND_VERSION, UNSOL_MODEM_RESTART]   # A: last three
        hal: [RadioModemProxy, RadioConfigProxy]
        services: [ExampleModemService]
        ipc: [VIPC_EXAMPLE_CAPABILITY]
