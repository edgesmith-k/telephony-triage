# Install runtime: python -m pip install .
# Install the locked test environment: python -m pip install '.[test]'
# Exact direct and transitive pins are kept here to avoid a separate lock artifact.
[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "telephony-triage"
version = "0.0.0"
description = "Development environment for the telephony-triage Claude plugin"
requires-python = ">=3.11"
dependencies = [
    "PyYAML==6.0.3",
    "jsonschema==4.26.0",
    "attrs==26.1.0",
    "jsonschema-specifications==2025.9.1",
    "referencing==0.37.0",
    "rpds-py==2026.6.3",
    "typing-extensions==4.15.0; python_version < '3.13'",
    "tzdata==2026.3; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = [
    "pytest==9.0.3",
    "iniconfig==2.3.0",
    "packaging==26.2",
    "pluggy==1.6.0",
    "Pygments==2.20.0",
    "colorama==0.4.6; sys_platform == 'win32'",
]

[tool.setuptools]
py-modules = []
